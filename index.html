<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Photo Collage Editor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="action-bar" id="action-bar" aria-label="Actions" data-i18n-aria-label="actions.label" hidden>
    <button
      class="icon-button"
      id="undo-button"
      type="button"
      data-icon="undo"
      aria-label="Undo last delete"
      data-i18n-aria-label="undo.button"
      hidden
    ></button>
    <div class="action-bar-tools" id="selection-actions">
      <!-- Text styling menus live in persistent wrappers so a repaint while a
           native color picker is open does not close them. They sit after the
           dynamic actions and before the empty-cell fill menu. -->
      <div class="text-menu-wrap" id="font-menu-wrap" hidden>
        <button
          class="icon-button"
          id="font-button"
          type="button"
          data-icon="brandFamily"
          aria-label="Change font"
          data-i18n-aria-label="action.font"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="font-menu"
        ></button>
        <div
          class="text-menu"
          id="font-menu"
          role="menu"
          aria-label="Font"
          data-i18n-aria-label="font.menu"
          hidden
        >
          <button class="color-menu-item" type="button" role="menuitem" data-font="sans" data-i18n="font.sans">Sans serif</button>
          <button class="color-menu-item" type="button" role="menuitem" data-font="serif" data-i18n="font.serif">Serif</button>
        </div>
      </div>
      <div class="text-menu-wrap" id="text-color-menu-wrap" hidden>
        <button
          class="icon-button"
          id="text-color-button"
          type="button"
          data-icon="colors"
          aria-label="Change text colors"
          data-i18n-aria-label="action.textColor"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="text-color-menu"
        ></button>
        <div
          class="text-menu"
          id="text-color-menu"
          role="dialog"
          aria-label="Text colors"
          data-i18n-aria-label="textColor.title"
          hidden
        >
          <button class="color-menu-item" type="button" id="text-color-row">
            <span class="color-menu-chip" id="text-color-chip"></span>
            <span data-i18n="textColor.text">Text color</span>
          </button>
          <button class="color-menu-item" type="button" id="text-outline-row">
            <span class="color-menu-chip" id="text-outline-chip"></span>
            <span data-i18n="textColor.outline">Outline color</span>
          </button>
        </div>
      </div>
      <div class="fill-menu-wrap" id="fill-menu-wrap" hidden>
        <button
          class="icon-button"
          id="fill-button"
          type="button"
          data-icon="colors"
          aria-label="Empty box color"
          data-i18n-aria-label="fill.button"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="fill-menu"
        ></button>
        <div
          class="fill-menu"
          id="fill-menu"
          role="dialog"
          aria-label="Empty box color and opacity"
          data-i18n-aria-label="fill.title"
          hidden
        >
          <button class="color-menu-item" type="button" id="fill-color-row">
            <span class="color-menu-chip" id="fill-color-chip"></span>
            <span data-i18n="fill.color">Color</span>
          </button>
          <div class="border-menu-head">
            <label class="border-menu-label" for="fill-opacity" data-i18n="fill.opacity">Opacity</label>
            <output class="border-menu-value" id="fill-opacity-value" for="fill-opacity">80%</output>
          </div>
          <input
            class="border-range"
            id="fill-opacity"
            type="range"
            min="0"
            max="100"
            step="1"
            value="80"
          >
        </div>
      </div>
    </div>
    <button
      class="icon-button"
      id="orientation-button"
      type="button"
      aria-label="Toggle row or column layout"
      data-i18n-aria-label="orientation.toggle"
      aria-pressed="false"
    ></button>
    <div class="border-menu-wrap" id="border-menu-wrap">
      <button
        class="icon-button"
        id="border-button"
        type="button"
        data-icon="borderWeight"
        aria-label="Change border thickness"
        data-i18n-aria-label="border.change"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="border-menu"
      ></button>
      <div
        class="border-menu"
        id="border-menu"
        role="dialog"
        aria-label="Border thickness"
        data-i18n-aria-label="border.title"
        hidden
      >
        <div class="border-menu-head">
          <label class="border-menu-label" for="border-range" data-i18n="border.title">Border thickness</label>
          <output class="border-menu-value" id="border-value" for="border-range">5 px</output>
        </div>
        <input
          class="border-range"
          id="border-range"
          type="range"
          min="0"
          max="100"
          step="1"
          value="5"
        >
      </div>
    </div>
    <div class="color-menu-wrap" id="color-menu-wrap">
      <button
        class="icon-button"
        id="margin-color-button"
        type="button"
        data-icon="colorFill"
        aria-label="Change margin color or gradient"
        data-i18n-aria-label="margin.change"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="color-menu"
      ></button>
      <div
        class="color-menu"
        id="color-menu"
        role="menu"
        aria-label="Margin paint"
        data-i18n-aria-label="margin.menu"
        hidden
      >
        <button class="color-menu-item" type="button" role="menuitem" data-paint="fill" data-icon="colors">
          <span data-i18n="margin.fill">Fill</span>
        </button>
        <button class="color-menu-item" type="button" role="menuitem" data-paint="gradient" data-icon="gradient">
          <span data-i18n="margin.gradient">Gradient</span>
        </button>
        <button class="color-menu-item" type="button" role="menuitem" data-gradient-stop="top" hidden>
          <span class="color-menu-chip" data-gradient-chip="top"></span>
          <span data-i18n="margin.gradientFirst">First color</span>
        </button>
        <button class="color-menu-item" type="button" role="menuitem" data-gradient-stop="bottom" hidden>
          <span class="color-menu-chip" data-gradient-chip="bottom"></span>
          <span data-i18n="margin.gradientSecond">Second color</span>
        </button>
        <button class="color-menu-item" type="button" role="menuitem" data-shuffle id="shuffle-spots" data-icon="shuffle" hidden>
          <span data-i18n="margin.shuffle">Shuffle spots</span>
        </button>
        <div
          class="color-presets"
          id="color-presets"
          role="group"
          aria-label="Color presets"
          data-i18n-aria-label="margin.presets"
          hidden
        ></div>
      </div>
      <div
        class="gradient-style-menu"
        id="gradient-style-menu"
        role="menu"
        aria-label="Gradient style"
        data-i18n-aria-label="margin.gradientStyle"
        hidden
      >
        <button class="color-menu-item" type="button" role="menuitem" data-gradient-style="vertical" data-icon="gradient">
          <span data-i18n="gradient.style.vertical">Top to bottom</span>
        </button>
        <button class="color-menu-item" type="button" role="menuitem" data-gradient-style="horizontal" data-icon="gradient" data-rotate="ccw">
          <span data-i18n="gradient.style.horizontal">Left to right</span>
        </button>
        <button class="color-menu-item" type="button" role="menuitem" data-gradient-style="radial" data-icon="vignette">
          <span data-i18n="gradient.style.radial">Radial</span>
        </button>
        <button class="color-menu-item" type="button" role="menuitem" data-gradient-style="spots" data-icon="blur">
          <span data-i18n="gradient.style.spots">Random spots</span>
        </button>
      </div>
      <div
        class="gradient-menu"
        id="gradient-menu"
        role="group"
        aria-label="Gradient colors"
        data-i18n-aria-label="margin.gradientTitle"
        hidden
      >
        <button class="color-menu-item" type="button" role="menuitem" data-gradient-pick="top">
          <span class="color-menu-chip" data-gradient-swatch-chip="top"></span>
          <span data-i18n="margin.gradientFirst">First color</span>
        </button>
        <button class="color-menu-item" type="button" role="menuitem" data-gradient-pick="bottom">
          <span class="color-menu-chip" data-gradient-swatch-chip="bottom"></span>
          <span data-i18n="margin.gradientSecond">Second color</span>
        </button>
        <div
          class="color-presets"
          id="gradient-presets"
          role="group"
          aria-label="Color presets"
          data-i18n-aria-label="margin.presets"
        ></div>
      </div>
    </div>
    <div class="save-menu-wrap" id="save-menu-wrap">
      <button
        class="icon-button"
        id="save-button"
        type="button"
        data-icon="download"
        aria-label="Save collage as JPEG or PNG"
        data-i18n-aria-label="save.button"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="save-menu"
      ></button>
      <div class="save-menu" id="save-menu" role="menu" aria-label="Save format" data-i18n-aria-label="save.menu" hidden>
        <button class="save-menu-item" type="button" role="menuitem" tabindex="-1" data-format="jpeg" data-i18n="save.jpeg">JPEG (.jpg)</button>
        <button class="save-menu-item" type="button" role="menuitem" tabindex="-1" data-format="png" data-i18n="save.png">PNG (.png)</button>
      </div>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <main class="editor-area" id="editor-area">
      <section class="format-screen" id="format-screen" aria-labelledby="format-title">
        <h1 class="format-title" id="format-title" data-i18n="format.title">Select format:</h1>
        <div class="format-options" id="format-options" role="group" aria-labelledby="format-title"></div>
      </section>

      <div class="stage" id="stage" hidden>
        <button class="icon-button" id="add-row-top" type="button" data-icon="add" aria-label="Add row above the canvas" data-i18n-aria-label="add.group.top"></button>

        <div class="canvas-line">
          <div class="row-rail" id="row-rail-left" role="group" aria-label="Row actions, left side" data-i18n-aria-label="rail.left"></div>

          <div class="canvas-wrap">
            <button
              class="icon-button free-add-button"
              id="add-free-button"
              type="button"
              data-icon="addBox"
              aria-label="Add free-form photo box"
              data-i18n-aria-label="free.add"
            ></button>
            <button
              class="icon-button free-add-button is-text"
              id="add-text-button"
              type="button"
              data-icon="editNote"
              aria-label="Add free-form text box"
              data-i18n-aria-label="text.add"
            ></button>
            <section class="canvas" id="canvas" aria-label="Photo collage canvas" data-i18n-aria-label="canvas.label" tabindex="-1">
              <div class="rows" id="rows"></div>
              <img class="zoom-overlay" id="zoom-overlay" alt="" draggable="false" hidden>
              <div
                class="zoom-handle"
                id="zoom-handle"
                role="slider"
                tabindex="0"
                aria-label="Photo zoom"
                data-i18n-aria-label="zoom.label"
                aria-valuemin="1"
                aria-valuemax="6"
                aria-valuenow="1"
                title="Drag outwards to zoom the photo"
                data-i18n-title="zoom.title"
                hidden
              ></div>
              <p class="canvas-empty" id="canvas-empty" data-i18n="empty.rows" hidden>
                No rows yet. Use the + button above or below the canvas to add one.
              </p>
              <div class="row-boundary" id="row-boundary" aria-hidden="true" hidden></div>
              <div class="box-boundary" id="box-boundary" aria-hidden="true" hidden></div>
            </section>

            <div class="free-layer" id="free-layer" role="group" aria-label="Free-form photos" data-i18n-aria-label="free.layer"></div>

            <div class="canvas-chrome">
              <div
                class="rotate-handle"
                id="rotate-handle"
                role="slider"
                tabindex="0"
                aria-label="Photo rotation"
                data-i18n-aria-label="rotate.label"
                aria-valuemin="-180"
                aria-valuemax="180"
                aria-valuenow="0"
                title="Drag around the photo to rotate it"
                data-i18n-title="rotate.title"
                hidden
              ></div>
            </div>
          </div>

          <div class="row-rail" id="row-rail-right" role="group" aria-label="Row actions, right side" data-i18n-aria-label="rail.right"></div>
        </div>

        <button class="icon-button" id="add-row-bottom" type="button" data-icon="add" aria-label="Add row below the canvas" data-i18n-aria-label="add.group.bottom"></button>
      </div>

      <div class="toast" id="toast" hidden></div>
    </main>

    <aside class="history-bar" id="history-bar" aria-label="Deleted photos" data-i18n-aria-label="history.label" hidden>
      <div class="history-list" id="history-list"></div>
      <button class="icon-button history-clear" id="history-clear" type="button" data-icon="delete" aria-label="Delete all deleted photos" data-i18n-aria-label="history.clear"></button>
    </aside>
  </div>

  <div
    class="text-dialog"
    id="text-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="text-dialog-title"
    hidden
  >
    <div class="text-dialog-panel">
      <h2 class="text-dialog-title" id="text-dialog-title" data-i18n="text.dialogTitle">Edit text</h2>
      <textarea
        class="text-dialog-input"
        id="text-dialog-input"
        rows="5"
        aria-label="Text"
        data-i18n-aria-label="text.input"
        placeholder="Type your text"
        data-i18n-placeholder="text.placeholder"
      ></textarea>
      <div class="text-dialog-actions">
        <button class="text-dialog-button" id="text-dialog-cancel" type="button" data-i18n="text.cancel">Cancel</button>
        <button class="text-dialog-button is-primary" id="text-dialog-save" type="button" data-i18n="text.save">Save</button>
      </div>
    </div>
  </div>

  <input class="visually-hidden" id="file-input" type="file" accept="image/*" tabindex="-1">
  <input class="visually-hidden" id="text-color-input" type="color" value="#ffffff" tabindex="-1" aria-label="Text color" data-i18n-aria-label="textColor.colorInput">
  <input class="visually-hidden" id="text-outline-input" type="color" value="#000000" tabindex="-1" aria-label="Outline color" data-i18n-aria-label="textColor.outlineInput">
  <input class="visually-hidden" id="margin-color-input" type="color" value="#ffffff" tabindex="-1" aria-label="Margin color" data-i18n-aria-label="margin.label">
  <input class="visually-hidden" id="fill-color-input" type="color" value="#cfcfcf" tabindex="-1" aria-label="Empty box color" data-i18n-aria-label="fill.colorInput">
  <input class="visually-hidden" id="gradient-top-input" type="color" value="#f5f2eb" tabindex="-1" aria-label="First gradient color" data-i18n-aria-label="margin.gradientFirst">
  <input class="visually-hidden" id="gradient-bottom-input" type="color" value="#dfd6c7" tabindex="-1" aria-label="Second gradient color" data-i18n-aria-label="margin.gradientSecond">
  <div class="visually-hidden" id="live-region" role="status" aria-live="polite"></div>

  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/images.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/history.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
