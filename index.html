<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Collage Editor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="action-bar" id="action-bar" aria-label="Actions">
    <div class="action-bar-tools" id="selection-actions"></div>
    <button class="icon-button" id="margin-color-button" type="button" data-icon="dashboard" aria-label="Change margin color"></button>
    <button class="icon-button" id="save-button" type="button" data-icon="download" data-action="save" aria-label="Save collage as PNG"></button>
  </header>

  <main class="editor-area" id="editor-area">
    <div class="stage" id="stage">
      <button class="icon-button" id="add-row-top" type="button" data-icon="add" aria-label="Add row above the canvas"></button>

      <div class="canvas-line">
        <div class="row-rail" id="row-rail-left" role="group" aria-label="Row actions, left side"></div>

        <div class="canvas-wrap">
          <section class="canvas" id="canvas" aria-label="Photo collage canvas" tabindex="-1">
            <div class="rows" id="rows"></div>
            <img class="zoom-overlay" id="zoom-overlay" alt="" draggable="false" hidden>
            <div
              class="zoom-handle"
              id="zoom-handle"
              role="slider"
              tabindex="0"
              aria-label="Photo zoom"
              aria-valuemin="1"
              aria-valuemax="6"
              aria-valuenow="1"
              title="Drag outwards to zoom the photo"
              hidden
            ></div>
            <p class="canvas-empty" id="canvas-empty" hidden>
              No rows yet. Use the + button above or below the canvas to add one.
            </p>
            <div class="row-boundary" id="row-boundary" aria-hidden="true" hidden></div>
            <div class="box-boundary" id="box-boundary" aria-hidden="true" hidden></div>
          </section>

          <div class="canvas-chrome">
            <div
              class="rotate-handle"
              id="rotate-handle"
              role="slider"
              tabindex="0"
              aria-label="Photo rotation"
              aria-valuemin="-180"
              aria-valuemax="180"
              aria-valuenow="0"
              title="Drag around the photo to rotate it"
              hidden
            ></div>
          </div>
        </div>

        <div class="row-rail" id="row-rail-right" role="group" aria-label="Row actions, right side"></div>
      </div>

      <button class="icon-button" id="add-row-bottom" type="button" data-icon="add" aria-label="Add row below the canvas"></button>
    </div>

    <div class="toast" id="toast" hidden></div>
  </main>

  <input class="visually-hidden" id="file-input" type="file" accept="image/*" tabindex="-1">
  <input class="visually-hidden" id="margin-color-input" type="color" value="#ffffff" tabindex="-1" aria-label="Margin color">
  <div class="visually-hidden" id="live-region" role="status" aria-live="polite"></div>

  <script src="js/layout.js"></script>
  <script src="js/images.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
